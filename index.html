<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时间与日程</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #111 url("background.jpg") center center / cover fixed no-repeat;
      color: #111;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      padding: 12px 0 14px;
      border-bottom: 1px solid #d8d8cf;
      background: rgba(255, 255, 255, 0.88);
      padding-left: 14px;
      padding-right: 14px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.3;
    }

    .sub {
      margin: 8px 0 0;
      color: #555;
      line-height: 1.6;
      font-size: 14px;
    }

    .section {
      margin-top: 18px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d8d8cf;
    }

    .label {
      margin: 0 0 8px;
      color: #666;
      font-size: 14px;
      font-weight: 700;
    }

    .time {
      font-size: 44px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0;
    }

    .date {
      margin-top: 8px;
      font-size: 18px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 700;
      font-size: 14px;
    }

    label:first-child {
      margin-top: 0;
    }

    input, textarea, button {
      box-sizing: border-box;
      font: inherit;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #aaa;
      background: #fff;
      color: #111;
    }

    input {
      min-height: 44px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
      line-height: 1.6;
    }

    .row {
      display: table;
      width: 100%;
      border-spacing: 0;
    }

    .col {
      display: table-cell;
      width: 50%;
      padding-right: 8px;
      vertical-align: top;
    }

    .col:last-child {
      padding-right: 0;
      padding-left: 8px;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 1px solid #111;
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    .secondary {
      margin-top: 8px;
      background: #fff;
      color: #111;
    }

    .list {
      margin-top: 12px;
    }

    .empty {
      margin: 12px 0 0;
      color: #666;
      line-height: 1.6;
    }

    .item {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #d8d8cf;
      background: #fbfbf8;
    }

    .item-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.45;
      font-weight: 700;
      word-break: break-word;
    }

    .item-time {
      margin: 5px 0 0;
      color: #555;
      line-height: 1.5;
      font-size: 14px;
    }

    .item-note {
      margin: 8px 0 0;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .item-actions {
      margin-top: 10px;
    }

    .small-btn {
      min-height: 36px;
      background: #fff;
      color: #111;
    }

    .note {
      margin-top: 10px;
      color: #666;
      line-height: 1.6;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .page {
        padding: 14px;
      }

      .time {
        font-size: 38px;
      }

      .row,
      .col {
        display: block;
        width: 100%;
      }

      .col,
      .col:last-child {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>时间与日程</h1>
      <p class="sub">纯静态网页。日程只保存在当前浏览器本地，不需要联网、不需要账号。</p>
    </header>

    <section class="section">
      <p class="label">当前时间</p>
      <div id="clock" class="time">--:--:--</div>
      <div id="date" class="date">正在读取日期...</div>
    </section>

    <section class="section">
      <p class="label">新增日程</p>

      <div class="row">
        <div class="col">
          <label for="day">日期</label>
          <input id="day" type="date">
        </div>
        <div class="col">
          <label for="time">时间</label>
          <input id="time" type="time">
        </div>
      </div>

      <label for="title">日程内容</label>
      <input id="title" type="text" placeholder="例如：下午三点开会">

      <label for="detail">备注，可不填</label>
      <textarea id="detail" placeholder="地点、联系人、要带的东西..."></textarea>

      <button id="addBtn" type="button">添加日程</button>
      <button id="clearBtn" class="secondary" type="button">清空全部</button>

      <p class="note">适合 GitHub Pages 和 Kindle 浏览器。若浏览器太旧不支持日期选择，可以直接输入日期。</p>
    </section>

    <section class="section">
      <p class="label">我的日程</p>
      <div id="list" class="list"></div>
    </section>
  </div>

  <script>
    var clockEl = document.getElementById("clock");
    var dateEl = document.getElementById("date");
    var dayInput = document.getElementById("day");
    var timeInput = document.getElementById("time");
    var titleInput = document.getElementById("title");
    var detailInput = document.getElementById("detail");
    var addBtn = document.getElementById("addBtn");
    var clearBtn = document.getElementById("clearBtn");
    var list = document.getElementById("list");
    var storageKey = "simple_schedule_items";
    var items = [];

    function pad(n) {
      return n < 10 ? "0" + n : String(n);
    }

    function todayString() {
      var now = new Date();
      return now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
    }

    function updateClock() {
      var now = new Date();
      var week = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      clockEl.innerHTML = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
      dateEl.innerHTML = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日 " + week[now.getDay()];
    }

    function saveItems() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(items));
      } catch (error) {
        alert("保存失败：当前浏览器可能不支持本地存储。");
      }
    }

    function loadItems() {
      try {
        var raw = localStorage.getItem(storageKey);
        items = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(items)) items = [];
      } catch (error) {
        items = [];
      }
    }

    function escapeText(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function sortItems() {
      items.sort(function (a, b) {
        var left = (a.day || "") + " " + (a.time || "");
        var right = (b.day || "") + " " + (b.time || "");
        return left < right ? -1 : left > right ? 1 : 0;
      });
    }

    function renderItems() {
      sortItems();
      if (!items.length) {
        list.innerHTML = '<p class="empty">还没有日程。添加一条后会显示在这里。</p>';
        return;
      }

      var html = "";
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var when = (item.day || "未填日期") + (item.time ? " " + item.time : "");
        html += '<div class="item">';
        html += '<p class="item-title">' + escapeText(item.title) + '</p>';
        html += '<p class="item-time">' + escapeText(when) + '</p>';
        if (item.detail) {
          html += '<p class="item-note">' + escapeText(item.detail) + '</p>';
        }
        html += '<div class="item-actions"><button class="small-btn" type="button" onclick="deleteItem(' + i + ')">删除</button></div>';
        html += '</div>';
      }
      list.innerHTML = html;
    }

    function addItem() {
      var title = titleInput.value.replace(/^\s+|\s+$/g, "");
      if (!title) {
        alert("请先输入日程内容。");
        return;
      }

      items.push({
        day: dayInput.value || todayString(),
        time: timeInput.value || "",
        title: title,
        detail: detailInput.value.replace(/^\s+|\s+$/g, "")
      });

      saveItems();
      renderItems();
      titleInput.value = "";
      detailInput.value = "";
      titleInput.focus();
    }

    function deleteItem(index) {
      items.splice(index, 1);
      saveItems();
      renderItems();
    }

    function clearItems() {
      if (!items.length) return;
      if (confirm("确定清空全部日程吗？")) {
        items = [];
        saveItems();
        renderItems();
      }
    }

    addBtn.onclick = addItem;
    clearBtn.onclick = clearItems;
    window.deleteItem = deleteItem;

    dayInput.value = todayString();
    updateClock();
    setInterval(updateClock, 1000);
    loadItems();
    renderItems();
  </script>
</body>
</html>
